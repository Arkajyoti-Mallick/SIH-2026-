version: '3.8'

services:
  backend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: landslidex_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - JWT_SECRET=GeoX2026_DisasterNet_SecureKey
      - DATABASE_URL=postgresql://geox:geoxpass@postgis:5432/landslidex_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgis
      - redis
    networks:
      - landslidex_net

  postgis:
    image: postgis/postgis:15-3.3-alpine
    container_name: landslidex_postgis
    restart: unless-stopped
    environment:
      - POSTGRES_USER=geox
      - POSTGRES_PASSWORD=geoxpass
      - POSTGRES_DB=landslidex_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    networks:
      - landslidex_net

  redis:
    image: redis:7-alpine
    container_name: landslidex_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - landslidex_net

  nginx:
    image: nginx:alpine
    container_name: landslidex_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - landslidex_net

volumes:
  postgis_data:

networks:
  landslidex_net:
    driver: bridge
